name: Check flight prices

on:
  schedule:
    # Times are UTC. These are 6:23am, 12:23pm and 6:23pm in Perth.
    - cron: "23 22,4,10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Check every trip now, ignoring the schedule"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check prices
        id: run
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAAPI_KEY }}
        run: python tracker.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Save results
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Price check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

      - name: Report scraper failure
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Price checks failed. Open the run log above for details."
          exit 1
